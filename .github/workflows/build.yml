name: Build O3DE Project

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    env:
      O3DE_VERSION: 25.05.1
      O3DE_WEB_VERSION_TAG: 2505_1

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest] # ubuntu-latest, macos-latest]
        config: [profile]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Linux specific setup
    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          clang \
          cmake \
          ninja-build \
          libxcb-xinerama0 \
          libxcb-xinput0 \
          libxcb-xfixes0 \
          libxcb-xkb1 \
          libxkbcommon-x11-0 \
          libfontconfig1-dev \
          libglu1-mesa-dev \
          libssl-dev \
          libunwind-dev \
          mesa-common-dev \
          libxcb-xinput-dev \
          libxcb-xfixes0-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-dev \
          libxcb-xkb-dev

    # Download and setup O3DE
    - name: Cache O3DE Engine
      id: cache-o3de
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/o3de-engine
        key: o3de-${{ runner.os }}-25.05.1

    - name: Check Linux environment
      run: |
        echo "Current Location: [${pwd}]"
        ls

    - name: Download O3DE Engine
      if: steps.cache-o3de.outputs.cache-hit != 'true' && runner.os == 'Linux'
      run: |
        # You'll need to download and extract O3DE here
        # This is simplified - adjust URLs based on actual O3DE releases
        echo "Download O3DE SDK for ${{ runner.os }}"
        # Example for downloading (adjust actual URLs):
        # wget https://o3de.org/downloads/o3de-sdk-windows.zip
        # unzip o3de-sdk-windows.zip -d o3de-engine
        curl https://o3debinaries.org/main/Latest/Linux/o3de_${{ env.O3DE_WEB_VERSION_TAG }}.deb -o o3de_${{ env.O3DE_WEB_VERSION_TAG}}.deb
        ls # debugg
        echo "-----------------------------"
        echo "Tryin' to install deb package"
        echo "-----------------------------"

        # sudo apt install ./o3de_${{ env.O3DE_WEB_VERSION_TAG}}.deb

    - name: DEB file check
      if:  steps.cache-o3de.outputs.cache-hit != 'true' && runner.os == 'Linux'
      run:
        ls -l o3de_${{ env.O3DE_WEB_VERSION_TAG}}.deb

    - name: Install O-three-dee (Ubuntu)
      if: steps.cache-o3de.outputs.cache-hit != 'true' && runner.os == 'Linux'
      run:
        sudo dpkg -i ./o3de_${{ env.O3DE_WEB_VERSION_TAG}}.deb

