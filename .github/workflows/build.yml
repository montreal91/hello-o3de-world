name: Build O3DE Project (Linux)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    env:
      O3DE_VERSION: 25.05.1
      O3DE_WEB_VERSION_TAG: 2505_1
      DEBUG: 0

    strategy:
      fail-fast: false
      matrix:
        # os: [ubuntu-latest] # ubuntu-latest, macos-latest]
        config: [profile]

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies (Linux)
      # if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          clang \
          cmake \
          ninja-build \
          libxcb-xinerama0 \
          libxcb-xinput0 \
          libxcb-xfixes0 \
          libxcb-xkb1 \
          libxkbcommon-x11-0 \
          libfontconfig1-dev \
          libglu1-mesa-dev \
          libssl-dev \
          libunwind-dev \
          mesa-common-dev \
          libxcb-xinput-dev \
          libxcb-xfixes0-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-dev \
          libxcb-xkb-dev

    # Download and setup O3DE
    - name: Cache O3DE Engine
      id: cache-o3de
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/o3de-engine
        key: o3de-${{ runner.os }}-25.05.1

    - name: Check Linux environment
      if: ${{env.DEBUG}}
      run: |
        echo "Current Location: [${pwd}]"
        ls

    - name: Download O3DE Engine
      if: steps.cache-o3de.outputs.cache-hit != 'true'
      run: |
        echo "Download O3DE SDK"
        curl https://o3debinaries.org/main/Latest/Linux/o3de_${{ env.O3DE_WEB_VERSION_TAG }}.deb -o o3de_${{ env.O3DE_WEB_VERSION_TAG}}.deb

    - name: DEB file check
      if: ${{ env.DEBUG }}
      run: |
        ls -l o3de_${{ env.O3DE_WEB_VERSION_TAG}}.deb

    - name: Install O-three-dee (Ubuntu)
      run: |
        sudo dpkg -i ./o3de_${{ env.O3DE_WEB_VERSION_TAG}}.deb

    - name: Check Python
      if: ${{ env.DEBUG }}
      run: |
        python3 --version

    - name: Get Python
      run: |
        /opt/O3DE/${{env.O3DE_VERSION}}/python/get_python.sh

    - name: python.sh Contents
      if: ${{ env.DEBUG }}
      run: |
        cat /opt/O3DE/${{env.O3DE_VERSION}}/python/get_python.sh

    - name: Init Python Environment
      if: runner.os == 'Linux'
      run: |
        echo "<<< Reading readme file >>>\n"
        cat /opt/O3DE/${{env.O3DE_VERSION}}/python/readme.md
        echo "\n<<< Finished reading a readme file >>>\n"
        echo "Trying to execute python venv installation script"
        /opt/O3DE/${{env.O3DE_VERSION}}/python/python.sh

    - name: Make o3de Virtual Environment
      run: |
        echo "Checking current location"
        pwd
        # cd /opt/o3de
        python3 -m venv /opt/o3de_venv
        source /opt/o3de_venv/bin/activate
        pip install -r /opt/O3DE/${{env.O3DE_VERSION}}/python/requirements.txt
        pip install -e /opt/O3DE/${{env.O3DE_VERSION}}/scripts/o3de


    - name: Check O-Three-Dee Python
      if: ${{ env.DEBUG }}
      run: |
        source /opt/o3de_venv/bin/activate
        python /opt/O3DE/${{env.O3DE_VERSION}}/scripts/o3de.py -h

    - name: Register O3DE engine & project
      run: |
        ENGINE=/opt/o3de
        echo "ENGINE=$ENGINE" >> $GITHUB_ENV
        python3 /opt/O3DE/${{env.O3DE_VERSION}}/scripts/o3de.py register --this-engine
        python3 /opt/O3DE/${{env.O3DE_VERSION}}/scripts/o3de.py -pp "${{ github.workspace }}"
        python3 /opt/O3DE/${{env.O3DE_VERSION}}/scripts/o3de.py set-default-project -pp "${{ github.workspace }}"

    - name: check curent directory
      if: ${{ env.DEBUG }}
      run: ls

    - name: Make the Build Directory
      run: mkdir build

    - name: Configure (CMake)
      run: |
        cd build
        cmake -S "${{ github.workspace }}" -G "Ninja Multi-Config"

    - name: Build (APBatch + GameLauncher)
      run: cmake --build . --target AssetProcessorBatch GameLauncher --config profile -j

    - name: Process assets
      run: "${{ github.workspace }}/build/linux/bin/profile/AssetProcessorBatch" --project-path "${{ github.workspace }}" --platform linux

    - name: Smoke run (5s)
      run: xvfb-run -a "${{ github.workspace }}/build/linux/bin/profile/GameLauncher" --project-path "${{ github.workspace }}" --console --exit-after 5
