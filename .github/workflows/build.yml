    # Download and setup O3DE
    - name: Cache O3DE Engine
      id: cache-o3de
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/o3de-engine
        key: o3de-${{ runner.os }}-25.05.1

    - name: Check Curl
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        curl.exe --version

    - name: Install O3DE (Windows)
      if: steps.cache-o3de.outputs.cache-hit != 'true' && runner.os == 'Windows'
      shell: powershell
      run: |
        # Get-Location
        cd ../..
        # Get-Location
        mkdir engine
        cd engine
        # Get-Location
        echo "Downloading O3DE Version: ${{env.O3DE_VERSION}}"
        curl.exe https://o3debinaries.org/main/Latest/Windows/o3de_installer_${{env.O3DE_WEB_VERSION_TAG}}-offline.zip -o o3de_installer_${{env.O3DE_WEB_VERSION_TAG}}.zip
        Expand-Archive -Path .\o3de_installer_${{env.O3DE_WEB_VERSION_TAG}}.zip -DestinationPath installer\
        cd installer
        dir # Temporary stuvv
        echo "Installing O3DE Version: ${{env.O3DE_VERSION}}"


